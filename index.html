<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>cmap</title>
		<script type="importmap">
			{
				"imports": {
					"d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
				}
			}
		</script>
		<style>
			html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
			main { position: relative; display: flex; flex-direction: column; height: 100%; }
			#toolbar { display: flex; gap: 6px; padding: 4px; }
			#workspace { display: flex; flex: 1; min-height: 0; }
			#plot,
			#plot > .chart-host {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}
			#plot { flex: 1; width: auto; min-height: 0; }
			#editor {
				position: absolute;
				z-index: 3;
				left: 12px;
				right: 12px;
				bottom: 12px;
				height: min(360px, 42vh);
				max-height: calc(100% - 48px);
				min-height: 180px;
				padding: 10px;
				border: 1px solid #d7dce3;
				border-radius: 10px;
				background: rgba(255, 255, 255, 0.98);
				box-shadow: 0 8px 28px rgba(23, 36, 54, 0.16);
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				font: 13px system-ui, sans-serif;
			}
			#editor[hidden] { display: none; }
			#editor h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
			#editor-resize-handle { height: 10px; margin: -10px -10px 0; cursor: ns-resize; touch-action: none; }
			#editor-resize-handle::after { content: ""; display: block; width: 36px; height: 3px; margin: 4px auto; border-radius: 3px; background: #aaa; }
			#editor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
			#editor-tabs { display: flex; gap: 4px; border-bottom: 1px solid #e1e5ea; margin-bottom: 10px; }
			#editor button, #editor select, #editor input:not([type="checkbox"]):not([type="color"]) { font: inherit; }
			#editor button { box-sizing: border-box; min-height: 30px; border: 1px solid #cbd3de; border-radius: 6px; padding: 4px 8px; background: #fff; color: #273444; cursor: pointer; }
			#editor button:hover:not(:disabled) { border-color: #78a9ed; background: #f4f8ff; }
			#editor button:disabled { color: #8993a1; border-color: #d8dde4; background: #f5f6f8; cursor: default; }
			#editor select, #editor input:not([type="checkbox"]):not([type="color"]) { box-sizing: border-box; height: 30px; border: 1px solid #bfc8d4; border-radius: 6px; padding: 3px 7px; background: #fff; color: #273444; }
			#editor-tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; font: inherit; cursor: pointer; }
			#editor-tabs button[aria-selected="true"] { border-bottom-color: #1677ff; font-weight: 600; }
			.editor-panel { display: flex; flex: 1; min-height: 0; flex-direction: column; }
			.editor-panel[hidden] { display: none; }
			#data-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
			#tree-actions { display: inline-flex; align-items: center; }
			#tree-actions[hidden] { display: none; }
			#member-group-filter { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; box-sizing: border-box; padding: 3px 5px 3px 8px; border: 1px solid #c6d8f0; border-radius: 6px; background: #f4f8ff; color: #36577e; font-size: 12px; white-space: nowrap; }
			#member-group-filter[hidden] { display: none; }
			#member-group-filter button { min-height: 22px; width: 22px; padding: 0; border: 0; background: transparent; color: #4f6d95; font-size: 16px; line-height: 1; }
			#member-group-filter button:hover { background: #dfeeff; }
			#group-create { display: flex; align-items: center; gap: 4px; }
			#group-create[hidden] { display: none; }
			#data-kind, #gene-view { display: flex; padding: 3px; border: 1px solid #e0e5eb; border-radius: 7px; background: #f2f4f7; }
			#gene-view[hidden] { display: none; }
			#data-kind button, #gene-view button { min-height: 28px; border: 0; border-radius: 4px; padding: 4px 9px; background: transparent; font: inherit; cursor: pointer; }
			#data-kind button:hover:not(:disabled), #gene-view button:hover:not(:disabled) { border-color: transparent; background: #e8eef7; }
			#data-kind button[aria-pressed="true"], #gene-view button[aria-pressed="true"] { background: white; box-shadow: 0 1px 2px rgba(29, 43, 61, .16); font-weight: 600; }
			#editor-filter { flex: 1 1 240px; min-width: 160px; box-sizing: border-box; }
			#editor-filter-clear { flex: 0 0 30px; width: 30px; min-width: 30px; height: 30px; padding: 0; font-size: 18px; line-height: 1; }
			#selection-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid #dce5f2; border-radius: 8px; background: #f7faff; margin: 0 0 8px; }
			#selection-actions[hidden] { display: none; }
			#selection-actions [hidden] { display: none !important; }
			#selection-actions > :not(.action-group) { flex: 0 0 auto; box-sizing: border-box; height: 30px; }
			#selection-actions strong { display: inline-flex; align-items: center; margin-right: 3px; padding: 4px 7px; border-radius: 5px; background: #e7f0ff; color: #184a86; }
			#selection-actions label { display: inline-flex; align-items: center; gap: 5px; color: #4c5b6d; font-weight: 500; }
			.action-group { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; }
			.action-group.separated { padding-left: 12px; border-left: 1px solid #cfd9e6; }
			.action-group > * { box-sizing: border-box; height: 30px; }
			#selection-actions #selection-unassign, #selection-actions #selection-begin-create-group { background: transparent; border-color: transparent; color: #3f5d83; }
			#selection-actions #selection-unassign:hover, #selection-actions #selection-begin-create-group:hover { border-color: #c6d8f0; background: #fff; }
			.destructive-action { color: #b3261e !important; border-color: #e4aaa5 !important; background: #fffafa !important; }
			.destructive-action:hover:not(:disabled) { border-color: #cc6f68 !important; background: #fff1f0 !important; }
			#editor-history { display: flex; gap: 5px; }
			#editor-history button { font-size: 12px; padding: 3px 7px; }
			#selection-label { width: 180px; max-width: 35vw; }
			#selection-colour-label { width: 40px; }
			#selection-colour { box-sizing: border-box; width: 40px; height: 30px; padding: 2px; }
			#selection-colour-label[hidden] { display: none; }
			#selection-group, #selection-merge-target { max-width: 220px; }
			#selection-new-group { width: 150px; max-width: 28vw; }
			.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
			#editor-list-scroll { flex: 1; min-height: 120px; overflow: auto; }
			#editor-list-scroll:focus-visible { outline: 2px solid #8dbbff; outline-offset: -2px; }
			#editor-rows { min-width: 0; }
			#editor-empty-state { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 120px; padding: 16px; box-sizing: border-box; color: #667386; font-size: 13px; text-align: center; }
			#editor-empty-state button { min-height: 28px; }
			#editor-list-header[hidden] { display: none; }
			/* Keep control columns compact and predictable; text columns absorb the remaining room. */
			.editor-list-header.gene-list, .editor-row.list-gene { display: grid; grid-template-columns: 28px minmax(150px, 1.35fr) minmax(90px, .8fr) minmax(110px, 1fr) minmax(90px, .85fr) 28px; align-items: center; column-gap: 7px; padding: 0 5px; box-sizing: border-box; }
			.editor-list-header.group-list, .editor-row.list-group { display: grid; grid-template-columns: 28px minmax(160px, 1.35fr) minmax(130px, 1fr) 78px 48px 48px; align-items: center; column-gap: 7px; padding: 0 5px; box-sizing: border-box; }
			.editor-list-header.link-list, .editor-row.list-link { display: grid; grid-template-columns: 28px minmax(110px, 1.1fr) minmax(110px, 1.1fr) 72px minmax(110px, 1fr) minmax(96px, .85fr) 48px 48px; align-items: center; column-gap: 7px; padding: 0 5px; box-sizing: border-box; }
			.editor-list-header { min-height: 32px; border-bottom: 1px solid #dbe2eb; background: #f7f9fc; color: #556274; font-size: 11px; font-weight: 650; }
			.editor-list-header > *, .editor-row.list-gene > *, .editor-row.list-group > *, .editor-row.list-link > * { min-width: 0; }
			#editor .editor-list-header button { min-width: 0; min-height: 32px; border: 0; border-radius: 0; padding: 3px 8px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			#editor .editor-list-header button:hover { background: #edf4ff; color: #145da8; }
			.editor-list-header .sort-indicator { display: inline-block; width: 10px; color: #1677ff; }
			.editor-list-header .utility-heading { justify-self: center; white-space: nowrap; }
			.editor-row { height: 34px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #eee; padding: 0 5px; box-sizing: border-box; cursor: pointer; }
			.editor-row:hover, .editor-row.selected { background: #f1f6ff; }
			.editor-row input[type="checkbox"] { opacity: .45; }
			.editor-row:hover input[type="checkbox"], .editor-row.selected input[type="checkbox"] { opacity: 1; }
			.editor-row .row-label { display: flex; min-width: 0; flex: 1; align-items: center; gap: 4px; overflow: hidden; white-space: nowrap; }
			.editor-row .label-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
			.editor-row .row-label[title] { cursor: text; }
			.editor-row .row-label[title]:hover { color: #145da8; text-decoration: underline dotted; text-underline-offset: 3px; }
			#editor .row-rename-button { flex: 0 0 22px; width: 22px; min-height: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #4f6d95; font-size: 14px; line-height: 1; opacity: 0; }
			.editor-row:hover .row-rename-button, .row-rename-button:focus-visible { opacity: 1; }
			#editor .row-rename-button:hover { background: #dfeeff; color: #145da8; }
			.editor-row .row-rename-input { min-width: 0; width: 100%; height: 28px; box-sizing: border-box; padding: 2px 6px; }
			.editor-row .identity { width: 100%; min-width: 0; height: 26px; padding: 2px 5px; text-align: right; }
			#editor .editor-row .identity-value { width: 100%; min-width: 0; min-height: 26px; height: 26px; padding: 2px 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #566579; font: inherit; text-align: right; cursor: text; }
			#editor .editor-row:hover .identity-value, #editor .editor-row .identity-value:focus-visible { border-color: #c6d8f0; background: #fff; color: #145da8; }
			.editor-row .context { color: #666; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.editor-row.list-gene .row-label, .editor-row.list-gene .source-column, .editor-row.list-group .source-column, .editor-row.list-link .source-column { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
			.editor-row.list-gene .source-column, .editor-row.list-group .source-column, .editor-row.list-link .source-column { color: #666; font-size: 11px; }
			.editor-row .colour { width: 28px; height: 22px; padding: 0; border: 0; background: transparent; }
			#editor .editor-row .visibility, #editor .tree-toggle { display: inline-grid; place-items: center; flex: 0 0 24px; width: 24px; height: 24px; min-height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #64748b; cursor: pointer; }
			#editor .editor-row .visibility:hover, #editor .tree-toggle:hover { background: #e7f0ff; color: #145da8; }
			.editor-row .visibility[aria-pressed="false"] { color: #9aa6b5; }
			.editor-row .visibility svg, .tree-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
			.editor-row.tree-cluster { font-weight: 600; background: #fafafa; }
			.editor-row.tree-locus { font-weight: 500; }
			.tree-toggle { font: inherit; }
			.editor-row.tree-group { font-weight: 600; background: #fafafa; }
			.tree-group-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
			.combined-tree-label { display: flex; flex: 1; min-width: 0; align-items: center; gap: 5px; }
			/* The compact hierarchy is a single breadcrumb, not two distant columns.
			   Keep the rename pencil out of layout so it does not create a blank
			   button-sized gap between the cluster and its only locus. */
			.combined-tree-label .row-label { position: relative; flex: 0 1 auto; overflow: visible; }
			.combined-tree-label .label-text { max-width: min(32vw, 340px); }
			.combined-tree-label .row-rename-button { position: absolute; left: 100%; top: 50%; transform: translate(2px, -50%); }
			.combined-tree-label > .row-rename-input { flex: 0 1 260px; width: min(260px, 42%); }
			.combined-tree-label .tree-name-separator { flex: 0 0 auto; color: #8a96a6; }
			.tree-spacer { flex: 0 0 auto; }
			.editor-spacer { height: 0; }
			#editor-list-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 29px; }
			#editor-summary { color: #667386; font-size: 12px; padding: 3px 5px 7px; }
			#select-all-visible { min-height: 26px; padding: 3px 7px; font-size: 12px; }
			#appearance-toolbar { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; }
			#appearance-filter { flex: 1; min-width: 160px; }
			#appearance-filter-clear { flex: 0 0 30px; width: 30px; min-width: 30px; height: 30px; padding: 0; font-size: 18px; line-height: 1; }
			#appearance-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 20px; overflow: auto; padding: 4px 0; }
			#appearance-controls fieldset { margin: 0; min-width: 0; border: 1px solid #ddd; border-radius: 4px; }
			#appearance-controls legend { padding: 0 4px; font-weight: 600; }
			#appearance-controls label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
			#appearance-controls label > span { min-width: 0; flex: 1; }
			#appearance-controls select, #appearance-controls input:not([type="checkbox"]):not([type="color"]) { min-width: 0; width: 76px; }
			#appearance-controls details { margin-top: 8px; border-top: 1px solid #e5e9ef; }
			#appearance-controls summary { padding: 7px 0 1px; color: #4f6d95; cursor: pointer; font-size: 12px; font-weight: 600; }
		</style>
	</head>
	<body>
		<main>
			<div id="toolbar">
				<button id="btn-save-svg">Save</button>
				<button id="btn-editor" aria-expanded="false">Edit data</button>
			</div>
			<div id="workspace">
				<div id="plot"></div>
			</div>
			<aside id="editor" hidden>
				<div id="editor-resize-handle" role="separator" aria-label="Resize plot editor" aria-orientation="horizontal"></div>
				<div id="editor-header"><h2>Plot editor</h2><div id="editor-history"><button id="selection-undo" disabled title="Undo the last editor change">Undo</button><button id="selection-redo" disabled title="Redo the last editor change">Redo</button></div></div>
				<div id="editor-tabs" role="tablist" aria-label="Plot editor sections">
					<button role="tab" data-editor-tab="data" aria-selected="true">Data</button>
					<button role="tab" data-editor-tab="appearance" aria-selected="false">Appearance</button>
				</div>
				<section class="editor-panel" data-editor-panel="data">
					<div id="data-toolbar">
						<div id="data-kind" aria-label="Data type">
							<button data-data-kind="groups" aria-pressed="true">Groups</button>
							<button data-data-kind="genes" aria-pressed="false">Genes</button>
							<button data-data-kind="links" aria-pressed="false">Links</button>
						</div>
						<div id="gene-view" aria-label="Gene view" hidden>
							<button data-gene-view="tree" aria-pressed="true" title="Group genes by cluster and locus">By locus</button>
							<button data-gene-view="groups" aria-pressed="false" title="Group genes by homology group">By group</button>
							<button data-gene-view="list" aria-pressed="false">List</button>
						</div>
						<div id="tree-actions" hidden>
							<button id="tree-toggle-all" title="Expand all currently visible branches">Expand visible</button>
						</div>
						<div id="member-group-filter" hidden><span>Group: <strong id="member-group-filter-label"></strong></span><button id="member-group-filter-clear" aria-label="Clear group member filter" title="Clear group member filter">×</button></div>
						<button id="group-begin-create" hidden>Create group…</button>
						<div id="group-create" hidden>
							<input id="new-group-name" type="text" placeholder="New group name" aria-label="New group name">
							<button id="new-group-create">Create group</button>
							<button id="group-cancel-create" title="Cancel creating group">Cancel</button>
						</div>
						<input id="editor-filter" type="search" placeholder="Search names, labels, loci, or clusters" aria-label="Filter visible data">
						<button id="editor-filter-clear" hidden aria-label="Clear filter" title="Clear filter (Escape)">×</button>
					</div>
					<div id="selection-actions" hidden>
						<strong id="selection-summary"></strong>
						<div class="action-group"><button id="selection-focus" title="Frame the selected records in the plot">Focus in plot</button></div>
						<div id="selection-presentation" class="action-group" hidden>
							<input id="selection-label" type="text" placeholder="Set label">
							<button id="selection-rename">Rename</button>
							<label id="selection-colour-label" title="Set colour"><span class="sr-only">Set colour</span><input id="selection-colour" type="color" aria-label="Set colour"></label>
						</div>
						<div id="selection-link-actions" class="action-group separated" hidden>
							<input id="selection-identity" type="number" min="0" max="100" step="0.1" placeholder="Set identity (%)">
							<button id="selection-set-identity">Set identity</button>
						</div>
						<div id="selection-visibility-actions" class="action-group separated" hidden>
							<select id="selection-visibility" aria-label="Change visibility"><option value="">Visibility…</option><option value="show">Show</option><option value="hide">Hide</option></select>
						</div>
						<div id="selection-gene-actions" class="action-group separated" hidden>
							<label id="selection-group-label">Move to <select id="selection-group" aria-label="Move selected genes to group"></select></label>
							<button id="selection-assign">Move</button>
							<button id="selection-unassign">Remove from groups</button>
							<button id="selection-begin-create-group">New group…</button>
							<label id="selection-new-group-label" hidden><span class="sr-only">New group name</span><input id="selection-new-group" type="text" placeholder="New group from selection"></label>
							<button id="selection-create-group" hidden>Create group</button>
						</div>
						<div id="selection-group-actions" class="action-group separated" hidden>
							<select id="selection-merge-target" aria-label="Group to keep when merging"></select>
							<button id="selection-merge">Merge groups</button>
						</div>
						<div id="selection-group-member-actions" class="action-group separated" hidden><button id="selection-view-members">View member genes</button></div>
						<div id="selection-danger-actions" class="action-group separated">
							<button id="selection-delete-genes" class="destructive-action" hidden>Delete selected genes</button>
							<button id="selection-delete-links" class="destructive-action" hidden>Delete selected links</button>
							<button id="selection-delete" class="destructive-action" hidden>Delete selected groups</button>
						</div>
						<button id="selection-clear">Clear selection</button>
					</div>
					<div id="editor-list-meta"><div id="editor-summary" class="summary"></div><button id="select-all-visible">Select all visible</button></div>
					<div id="editor-list-header" class="editor-list-header" hidden></div>
					<div id="editor-list-scroll" tabindex="0" role="region" aria-label="Data table; press Control or Command A to select visible rows, or Escape to clear selection">
						<div id="editor-rows"></div>
					</div>
				</section>
				<section class="editor-panel" data-editor-panel="appearance" hidden>
					<div id="appearance-toolbar">
						<input id="appearance-filter" type="search" placeholder="Find a setting" aria-label="Find an appearance setting">
						<button id="appearance-filter-clear" hidden aria-label="Clear appearance filter" title="Clear filter">×</button>
					</div>
					<div id="appearance-controls">
						<fieldset><legend>Legend</legend>
							<label><input data-config="legend.show" type="checkbox"> Show legend</label>
							<label><span>Position</span><select data-config="legend.position"><option value="right">Right</option><option value="bottom">Bottom</option></select></label>
							<label><span>Columns</span><input data-config="legend.columns" type="number" min="1" step="1"></label>
							<details><summary>Advanced</summary>
							<label><span>Column width</span><input data-config="legend.columnWidth" type="number" min="1"></label>
							<label><span>Entry height</span><input data-config="legend.entryHeight" type="number" min="1"></label>
							<label><span>Font size</span><input data-config="legend.fontSize" type="number" min="1"></label>
							<label><span>Subtitle size</span><input data-config="legend.subtitleFontSize" type="number" min="1"></label>
							<label><span>Left margin</span><input data-config="legend.marginLeft" type="number" min="0"></label>
							<label><span>Top margin</span><input data-config="legend.marginTop" type="number" min="0"></label>
							</details>
						</fieldset>
						<fieldset><legend>Links</legend>
							<label><input data-config="link.show" type="checkbox"> Show links</label>
							<label><input data-config="link.asLine" type="checkbox"> Draw as lines</label>
							<label><input data-config="link.bestOnly" type="checkbox"> Best match only</label>
							<label><span>Minimum identity</span><input data-config="link.threshold" type="range" min="0" max="1" step="0.05" data-output></label>
							<details><summary>Advanced</summary>
							<label><input data-config="link.straight" type="checkbox"> Straight links</label>
							<label><input data-config="link.groupColour" type="checkbox"> Use group colour</label>
							<label><span>Stroke width</span><input data-config="link.strokeWidth" type="number" min="0" step="0.1"></label>
							</details>
						</fieldset>
						<fieldset><legend>Link labels</legend>
							<label><input data-config="link.label.show" type="checkbox"> Show link labels</label>
							<details><summary>Advanced</summary>
							<label><input data-config="link.label.background" type="checkbox"> Label background</label>
							<label><span>Font size</span><input data-config="link.label.fontSize" type="number" min="1"></label>
							<label><span>Position</span><input data-config="link.label.position" type="number" min="0" max="1" step="0.05"></label>
							</details>
						</fieldset>
						<fieldset><legend>Clusters &amp; loci</legend>
							<label><input data-config="cluster.alignLabels" type="checkbox"> Align cluster labels</label>

						<fieldset><legend>Genes</legend>

							<label><span>Label position</span><select data-config="gene.label.position"><option value="top">Top</option><option value="bottom">Bottom</option></select></label>
							<details><summary>Advanced</summary>
							<label><span>Label anchor</span><select data-config="gene.label.anchor"><option value="start">Start</option><option value="middle">Middle</option><option value="end">End</option></select></label>
							<label><span>Label size</span><input data-config="gene.label.fontSize" type="number" min="1"></label>

							<label><span>Label spacing</span><input data-config="gene.label.spacing" type="number" min="0"></label>
							<label><span>Label start</span><input data-config="gene.label.start" type="number" min="0" max="1" step="0.05"></label>

							<label><span>Minimum source</span><select data-config="colourBar.domain.minMode"><option value="fixed">Custom value</option><option value="data">Lowest identity in data</option></select></label>
							<label><span>Minimum identity (%)</span><input data-config="colourBar.domain.min" data-percent data-identity-bound="min" type="number" min="0" max="100" step="0.1"></label>
							<label><span>Maximum source</span><select data-config="colourBar.domain.maxMode"><option value="fixed">Custom value</option><option value="data">Highest identity in data</option></select></label>
							<label><span>Maximum identity (%)</span><input data-config="colourBar.domain.max" data-percent data-identity-bound="max" type="number" min="0" max="100" step="0.1"></label>
							<details><summary>Advanced</summary>
							<label><span>Height</span><input data-config="scaleBar.height" type="number" min="1"></label>
							<label><span>Font size</span><input data-config="scaleBar.fontSize" type="number" min="1"></label>

							<label><span>Colour</span><input data-config="scaleBar.colour" type="color"></label>
							<label><span>Scale margin</span><input data-config="scaleBar.marginTop" type="number" min="0"></label>
							<label><span>Identity width</span><input data-config="colourBar.width" type="number" min="1"></label>
							<label><span>Identity height</span><input data-config="colourBar.height" type="number" min="1"></label>
							<label><span>Identity font size</span><input data-config="colourBar.fontSize" type="number" min="1"></label>
							<label><span>Identity margin</span><input data-config="colourBar.marginTop" type="number" min="0"></label>
							</details>
						</fieldset>
						<fieldset><legend>Plot &amp; navigation</legend>
							<label><span>Renderer</span><select data-config="plot.renderer"><option value="svg">SVG</option><option value="canvas">Canvas</option><option value="webgpu">WebGPU</option></select></label>
							<label><input data-config="plot.minimap.show" type="checkbox"> Show minimap</label>
							<label><span>Minimum zoom</span><input data-config="plot.minZoom" type="number" min="0" step="0.1"></label>
							<label><span>Maximum zoom</span><input data-config="plot.maxZoom" type="number" min="0.1" step="0.1"></label>
							<details><summary>Advanced</summary>
							<label><span>Transition (ms)</span><input data-config="plot.transitionDuration" type="number" min="0"></label>
							<label><span>Scale factor</span><input data-config="plot.scaleFactor" type="number" min="0.1" step="0.1"></label>
							<label><input data-config="plot.scaleGenes" type="checkbox"> Scale genes</label>
							<label><span>Font family</span><input data-config="plot.fontFamily" type="text"></label>
							<label><input data-config="plot.minimap.showLinks" type="checkbox"> Minimap links</label>
							<label><span>Minimap width</span><input data-config="plot.minimap.width" type="number" min="1"></label>
							<label><span>Minimap height</span><input data-config="plot.minimap.height" type="number" min="1"></label>
							<label><span>Minimap margin</span><input data-config="plot.minimap.margin" type="number" min="0"></label>
							</details>
						</fieldset>
					</div>
				</section>
				</aside>
		</main>
	</body>
	<script type="module">
		import * as d3 from "d3"
		import clusterMap from "./src/clusterMap.js"
		import { createLargeTestingData } from "./largeTestingData.mjs"
		// The demo exposes D3 for its test harness; the library itself imports
		// its declared D3 dependency and no longer reads this global.
		window.d3 = d3
		const params = new URLSearchParams(window.location.search)
		const testMode = params.has("test")
		const fixture = params.get("fixture")
		const biologicalFixtures = {
			mcaa: "fixtures/mcaa-neighbourhoods-173.json",
			pks: "fixtures/pks-regions-142.json",
		}
		const biologicalFixture = biologicalFixtures[fixture]
		const renderer = params.get("renderer") || (fixture === "large" || biologicalFixture ? "canvas" : "svg")
		const minimumZoom = Number(params.get("minZoom"))
		const editorEnabled = params.has("editor")

		function download(blob, filename) {
			/* Downloads a given blob to filename.
			 * This function appends a new anchor to the document, which points to the
			 * supplied blob. The anchor.click() method is called to trigger the download,
			 * then the anchor is removed.
			*/
			const link = document.createElement("a");
			link.href = URL.createObjectURL(blob);
			link.download = filename;
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);
		}

		const div = d3.select("#plot")
			.attr("width", "100vw")
			.attr("height", "100vh")

		const chart = clusterMap()
			.config({
        plot: {
          transitionDuration: testMode ? 0 : 250,
          renderer,
					minZoom: Number.isFinite(minimumZoom) ? minimumZoom : 0,
					minimap: { show: params.has("minimap") },
        },
        cluster: {
          alignLabels: false
        },
				gene: {
					label: {
						show: false
					}
				},
				legend: {
					show: true,
					position: fixture === "large" || biologicalFixture ? "bottom" : "right",
					columns: biologicalFixture ? 8 : 1,
				},
				link: {
					threshold: 0.3,
          bestOnly: true,
				}
			})

		const data = fixture === "large"
			? Promise.resolve(createLargeTestingData())
			: biologicalFixture
				? d3.json(biologicalFixture)
				: d3.json("testing.json")

		const editor = {
			root: document.querySelector("#editor"),
			button: document.querySelector("#btn-editor"),
			filter: document.querySelector("#editor-filter"),
			filterClear: document.querySelector("#editor-filter-clear"),
			rows: document.querySelector("#editor-rows"),
			listHeader: document.querySelector("#editor-list-header"),
			viewport: document.querySelector("#editor-list-scroll"),
			summary: document.querySelector("#editor-summary"),
			kindButtons: [...document.querySelectorAll("[data-data-kind]")],
			geneView: document.querySelector("#gene-view"),
			geneViewButtons: [...document.querySelectorAll("[data-gene-view]")],
			treeActions: document.querySelector("#tree-actions"),
			treeToggleAll: document.querySelector("#tree-toggle-all"),
			memberGroupFilter: document.querySelector("#member-group-filter"),
			memberGroupFilterLabel: document.querySelector("#member-group-filter-label"),
			memberGroupFilterClear: document.querySelector("#member-group-filter-clear"),
			groupCreate: document.querySelector("#group-create"),
			groupBeginCreate: document.querySelector("#group-begin-create"),
			groupCancelCreate: document.querySelector("#group-cancel-create"),
			newGroupName: document.querySelector("#new-group-name"),
			newGroupCreate: document.querySelector("#new-group-create"),
			selectionActions: document.querySelector("#selection-actions"),
			selectionSummary: document.querySelector("#selection-summary"),
			selectionFocus: document.querySelector("#selection-focus"),
			selectionPresentation: document.querySelector("#selection-presentation"),
			selectionLinkActions: document.querySelector("#selection-link-actions"),
			selectionVisibilityActions: document.querySelector("#selection-visibility-actions"),
			selectionGeneActions: document.querySelector("#selection-gene-actions"),
			selectionGroupActions: document.querySelector("#selection-group-actions"),
			selectionGroupMemberActions: document.querySelector("#selection-group-member-actions"),
			selectionViewMembers: document.querySelector("#selection-view-members"),
			selectionDangerActions: document.querySelector("#selection-danger-actions"),
			selectionLabel: document.querySelector("#selection-label"),
			selectionRename: document.querySelector("#selection-rename"),
			selectionColour: document.querySelector("#selection-colour"),
			selectionColourLabel: document.querySelector("#selection-colour-label"),
			selectionIdentity: document.querySelector("#selection-identity"),
			selectionSetIdentity: document.querySelector("#selection-set-identity"),
			selectionVisibility: document.querySelector("#selection-visibility"),
			selectionGroup: document.querySelector("#selection-group"),
			selectionGroupLabel: document.querySelector("#selection-group-label"),
			selectionAssign: document.querySelector("#selection-assign"),
			selectionUnassign: document.querySelector("#selection-unassign"),
			selectionBeginCreateGroup: document.querySelector("#selection-begin-create-group"),
			selectionNewGroup: document.querySelector("#selection-new-group"),
			selectionNewGroupLabel: document.querySelector("#selection-new-group-label"),
			selectionCreateGroup: document.querySelector("#selection-create-group"),
			selectionDeleteGenes: document.querySelector("#selection-delete-genes"),
			selectionDeleteLinks: document.querySelector("#selection-delete-links"),
			selectionMergeTarget: document.querySelector("#selection-merge-target"),
			selectionMerge: document.querySelector("#selection-merge"),
			selectionDelete: document.querySelector("#selection-delete"),
			selectionClear: document.querySelector("#selection-clear"),
			selectionUndo: document.querySelector("#selection-undo"),
			selectionRedo: document.querySelector("#selection-redo"),
			selectAllVisible: document.querySelector("#select-all-visible"),
			resizeHandle: document.querySelector("#editor-resize-handle"),
			tabs: [...document.querySelectorAll("[data-editor-tab]")],
			panels: [...document.querySelectorAll("[data-editor-panel]")],
			appearanceFields: [...document.querySelectorAll("[data-config]")],
			appearanceFilter: document.querySelector("#appearance-filter"),
			appearanceFilterClear: document.querySelector("#appearance-filter-clear"),
			kind: "groups",
			geneMode: "tree",
			creatingGroup: false,
			creatingStandaloneGroup: false,
			renameKey: null,
			identityKey: null,
			memberGroupUid: null,
			selected: new Set(),
			selectionAnchor: null,
			pendingRangeSelection: null,
			expanded: new Set(),
			history: [],
			future: [],
			allRows: [],
			sort: { column: "label", direction: 1 },
			rowHeight: 34,
			overscan: 8,
		}

		const escapeHtml = (value) => String(value ?? "")
			.replaceAll("&", "&amp;").replaceAll("<", "&lt;")
			.replaceAll(">", "&gt;").replaceAll('"', "&quot;")
		// The chart assigns its default palette as CSS rgb() strings. Colour inputs
		// only accept a hex value, so normalize both defaults and explicit colours.
		const colourInputValue = (value) => d3.color(value || "#888888")?.formatHex() || "#888888"
		const labelFor = (record, fallback) => record.label || record.name || fallback
		const matches = (needle, ...values) => !needle || values.join(" ").toLowerCase().includes(needle)
		// Fixture and external data may represent a gene UID as either a number or
		// a string. Keep both forms so membership, colour, and member filtering
		// agree with the chart's normalized gene records.
		const groupForGene = (data) => new Map(data.groups.flatMap((group) => group.genes.flatMap((uid) => [[uid, group], [String(uid), group]])))
		const linkRows = (data, groups, needle) => {
			const genes = new Map(data.clusters.flatMap((cluster) => cluster.loci.flatMap((locus) => locus.genes)).map((gene) => [gene.uid, gene]))
			const domain = chart.config().colourBar.domain
			const identities = data.links.map((link) => link.identity).filter(Number.isFinite)
			const min = domain.minMode === "data" && identities.length ? d3.min(identities) : domain.min
			const max = domain.maxMode === "data" && identities.length ? d3.max(identities) : domain.max
			const scoreColour = d3.scaleSequential(d3.interpolateGreys)
				.domain(min === max ? [Math.max(0, min - 0.005), Math.min(1, max + 0.005)] : [min, max])
				.clamp(true)
			const defaultColour = (link) => chart.config().link.groupColour
				? groups.get(link.query.uid)?.colour
				: scoreColour(link.identity)
			return data.links.map((link) => {
				const query = genes.get(link.query.uid)
				const target = genes.get(link.target.uid)
				const endpoints = `${labelFor(query, "Missing gene")} ↔ ${labelFor(target, "Missing gene")}`
				const queryGroup = labelFor(groups.get(link.query.uid), "Ungrouped")
				const targetGroup = labelFor(groups.get(link.target.uid), "Ungrouped")
				const identity = Math.round(link.identity * 100)
				const context = `${identity}% identity · ${queryGroup} / ${targetGroup}`
				return {
					key: `link:${link.uid}`,
					type: "link",
					// A link label is optional annotation text. Endpoints remain the
					// stable identity shown first in the table and are not duplicated
					// as a synthetic "name".
					label: link.label || "",
					query: labelFor(query, "Missing gene"),
					target: labelFor(target, "Missing gene"),
					identity,
					groups: `${queryGroup} / ${targetGroup}`,
					context,
					colour: link.colour || defaultColour(link),
					hidden: Boolean(link.hidden),
					selectIds: [link.uid],
					depth: 0,
				}
			}).filter((row) => matches(needle, row.label, row.query, row.target, row.groups, row.context))
		}
		const geneMatchesMemberFilter = (gene, groups) => !editor.memberGroupUid || groups.get(gene.uid)?.uid === editor.memberGroupUid
		const flatGeneRows = (data, groups) => data.clusters.flatMap((cluster) => cluster.loci.flatMap((locus) =>
			locus.genes.filter((gene) => geneMatchesMemberFilter(gene, groups)).map((gene) => {
				const group = groups.get(gene.uid)
				return {
					key: `gene:${gene.uid}`,
					label: labelFor(gene, gene.uid),
					locus: labelFor(locus, locus.uid),
					cluster: labelFor(cluster, cluster.uid),
					group: group ? labelFor(group, "Ungrouped") : "Ungrouped",
					colour: gene.colour || group?.colour,
					selectIds: [gene.uid],
					depth: 0,
					type: "gene",
				}
			})
		))
		const treeGeneRows = (data, groups, needle) => {
			const visibleGenes = (locus, cluster) => {
				const members = locus.genes.filter((gene) => geneMatchesMemberFilter(gene, groups))
				return matches(needle, labelFor(locus, ""), labelFor(cluster, ""))
					? members
					: members.filter((gene) => matches(needle, labelFor(gene, "")))
			}
			const rows = []
			for (const cluster of data.clusters) {
				const clusterGenes = cluster.loci.flatMap((locus) => visibleGenes(locus, cluster))
				if (!clusterGenes.length) continue
				// A one-locus cluster has no useful intermediate hierarchy. Keep its
				// cluster and locus names together, but retain separate inline rename
				// affordances for each record.
				if (cluster.loci.length === 1) {
					const locus = cluster.loci[0]
					const locusGenes = visibleGenes(locus, cluster)
					const key = `cluster-locus:${cluster.uid}:${locus.uid}`
					const expanded = Boolean(needle) || editor.expanded.has(key)
					rows.push({
						key,
						type: "cluster-locus",
						clusterUid: cluster.uid,
						locusUid: locus.uid,
						label: labelFor(cluster, "Unlabelled cluster"),
						locusLabel: labelFor(locus, "Unlabelled locus"),
						context: `${locus.start + 1}–${locus.end} · ${locusGenes.length} genes`,
						selectIds: locusGenes.map((gene) => gene.uid),
						depth: 0,
						expandable: true,
						expanded,
					})
					if (expanded) {
						for (const gene of locusGenes) {
							rows.push({ key: `gene:${gene.uid}`, type: "gene", label: labelFor(gene, "Unlabelled gene"), context: groups.get(gene.uid)?.label || "Ungrouped", colour: gene.colour || groups.get(gene.uid)?.colour, selectIds: [gene.uid], depth: 1 })
						}
					}
					continue
				}
				const clusterKey = `cluster:${cluster.uid}`
				const clusterOpen = Boolean(needle) || editor.expanded.has(clusterKey)
				rows.push({ key: clusterKey, type: "cluster", label: labelFor(cluster, "Unlabelled cluster"), context: `${cluster.loci.length} loci · ${clusterGenes.length} genes`, selectIds: clusterGenes.map((gene) => gene.uid), depth: 0, expandable: true, expanded: clusterOpen })
				if (!clusterOpen) continue
				for (const locus of cluster.loci) {
					const locusGenes = visibleGenes(locus, cluster)
					if (!locusGenes.length) continue
					const locusKey = `locus:${locus.uid}`
					const locusOpen = Boolean(needle) || editor.expanded.has(locusKey)
					rows.push({ key: locusKey, type: "locus", label: labelFor(locus, "Unlabelled locus"), context: `${locus.start + 1}–${locus.end} · ${locusGenes.length} genes`, selectIds: locusGenes.map((gene) => gene.uid), depth: 1, expandable: true, expanded: locusOpen })
					if (!locusOpen) continue
					for (const gene of locusGenes) {
						rows.push({ key: `gene:${gene.uid}`, type: "gene", label: labelFor(gene, "Unlabelled gene"), context: groups.get(gene.uid)?.label || "Ungrouped", colour: gene.colour || groups.get(gene.uid)?.colour, selectIds: [gene.uid], depth: 2 })
					}
				}
			}
			return rows
		}
		const groupGeneRows = (data, groups, needle) => {
			const entries = data.clusters.flatMap((cluster) => cluster.loci.flatMap((locus) =>
				locus.genes
					.filter((gene) => geneMatchesMemberFilter(gene, groups))
					.map((gene) => ({ gene, locus, cluster }))
			))
			const rows = []
			const groupBuckets = [
				...data.groups.map((group) => ({
					key: `gene-group:${group.uid}`,
					label: labelFor(group, "Unlabelled group"),
					subtitle: group.subtitle || "",
					genes: entries.filter(({ gene }) => groups.get(gene.uid)?.uid === group.uid),
				})),
				{
					key: "gene-group:ungrouped",
					label: "Ungrouped",
					subtitle: "",
					genes: entries.filter(({ gene }) => !groups.has(gene.uid)),
				},
			]
			for (const bucket of groupBuckets) {
				const parentMatches = matches(needle, bucket.label, bucket.subtitle)
				const visibleGenes = parentMatches
					? bucket.genes
					: bucket.genes.filter(({ gene, locus, cluster }) => matches(needle, labelFor(gene, ""), labelFor(locus, ""), labelFor(cluster, "")))
				if (!visibleGenes.length) continue
				const expanded = Boolean(needle) || editor.expanded.has(bucket.key)
				rows.push({
					key: bucket.key,
					type: "gene-group",
					label: bucket.label,
					context: `${visibleGenes.length} gene${visibleGenes.length === 1 ? "" : "s"}`,
					selectIds: visibleGenes.map(({ gene }) => gene.uid),
					depth: 0,
					expandable: true,
					expanded,
				})
				if (!expanded) continue
				for (const { gene, locus, cluster } of visibleGenes) {
					rows.push({
						key: `gene:${gene.uid}`,
						type: "gene",
						label: labelFor(gene, "Unlabelled gene"),
						context: `${labelFor(locus, locus.uid)} · ${labelFor(cluster, cluster.uid)}`,
						colour: gene.colour || groups.get(gene.uid)?.colour,
						selectIds: [gene.uid],
						depth: 1,
					})
				}
			}
			return rows
		}
		const refreshEditorRows = () => {
			const data = chart.data()
			if (!data) return
			const needle = editor.filter.value.trim().toLowerCase()
			const groups = groupForGene(data)
			const sortRows = (rows) => rows.sort((left, right) => {
				const leftValue = left[editor.sort.column] ?? ""
				const rightValue = right[editor.sort.column] ?? ""
				const comparison = Number.isFinite(leftValue) && Number.isFinite(rightValue)
					? leftValue - rightValue
					: String(leftValue).localeCompare(String(rightValue), undefined, { numeric: true, sensitivity: "base" })
				return editor.sort.direction * comparison
			})
			if (editor.kind === "groups") {
				editor.allRows = data.groups
					.map((group) => ({ key: `group:${group.uid}`, type: "group", label: labelFor(group, "Unlabelled group"), subtitle: group.subtitle || "", genes: group.genes.length, context: `${group.genes.length} genes`, colour: group.colour, hidden: Boolean(group.hidden), selectIds: [group.uid], depth: 0 }))
					.filter((row) => matches(needle, row.label, row.subtitle, row.context))
				editor.allRows = sortRows(editor.allRows)
			} else if (editor.kind === "links") {
				editor.allRows = sortRows(linkRows(data, groups, needle))
			} else if (editor.geneMode === "tree") {
				editor.allRows = treeGeneRows(data, groups, needle)
			} else if (editor.geneMode === "groups") {
				editor.allRows = groupGeneRows(data, groups, needle)
			} else {
				editor.allRows = sortRows(flatGeneRows(data, groups)
					.filter((row) => matches(needle, row.label, row.locus, row.cluster, row.group)))
			}
			editor.rowByKey = new Map(editor.allRows.map((row) => [row.key, row]))
		}
		const selectedFor = (row) => row.selectIds.length > 0 && row.selectIds.every((uid) => editor.selected.has(uid))
		const selectRowRange = (row) => {
			const anchor = editor.allRows.findIndex((candidate) => candidate.key === editor.selectionAnchor)
			const target = editor.allRows.findIndex((candidate) => candidate.key === row.key)
			if (anchor < 0 || target < 0) return false
			editor.allRows.slice(Math.min(anchor, target), Math.max(anchor, target) + 1)
				.flatMap((candidate) => candidate.selectIds)
				.forEach((uid) => editor.selected.add(uid))
			return true
		}
		const updateRowSelection = (row, { selected, range = false } = {}) => {
			if (!(range && editor.selectionAnchor && selectRowRange(row))) {
				row.selectIds.forEach((uid) => selected ? editor.selected.add(uid) : editor.selected.delete(uid))
			}
			editor.selectionAnchor = row.key
		}
		const listSortHeader = () => {

			const renderEditor = ({ refresh = true } = {}) => {

			const linkList = editor.kind === "links"

			editor.treeToggleAll.title = hasCollapsedTreeBranch

			editor.listHeader.className = `editor-list-header ${flatGenes ? "gene-list" : groupList ? "group-list" : linkList ? "link-list" : ""}`
			editor.listHeader.innerHTML = listSortHeader()

				? "Filter gene, locus, cluster, or group"
				: "Search names, labels, loci, or clusters"
			editor.filterClear.hidden = !editor.filter.value
			editor.memberGroupFilter.hidden = !genes || !memberGroup
			if (memberGroup) editor.memberGroupFilterLabel.textContent = labelFor(memberGroup, memberGroup.uid)
			const selectable = new Set(allRows.flatMap((row) => row.selectIds))
			if (genes && editor.geneMode !== "list") {
				editor.summary.textContent = `${allRows.length} visible tree rows · ${selectable.size.toLocaleString()} selectable genes${editor.filter.value ? " matching search" : ""}${memberGroup ? " in selected group" : ""}.`
			} else {
				const noun = editor.kind === "groups" ? "groups" : links ? "links" : "genes"
				editor.summary.textContent = `${allRows.length} visible ${noun}${editor.filter.value ? " matching search" : ""}${memberGroup ? " in selected group" : ""}.`

			editor.selectAllVisible.hidden = selectable.size === 0
			editor.selectAllVisible.disabled = selectable.size > 0 && [...selectable].every((uid) => editor.selected.has(uid))

		const recordsForKind = () => {

		}
		const recordForRenameKey = (key) => {

			if (type === "locus") return data.clusters.flatMap((cluster) => cluster.loci).find((record) => String(record.uid) === uid)
			if (type === "cluster") return data.clusters.find((record) => String(record.uid) === uid)

			if (!record || (!name && type !== "group-subtitle") || name === record[field]) return

			if (editor.kind === "links") return chart.focus({ links: editor.selected })
			if (editor.kind === "groups") {

					.filter((group) => editor.selected.has(group.uid))
					.flatMap((group) => group.genes) || []
				return chart.focus({ genes })

		const viewSelectedGroupMembers = () => {

			editor.memberGroupUid = [...editor.selected][0]

			editor.geneMode = "list"

			editor.creatingStandaloneGroup = false
			editor.renameKey = null
			editor.identityKey = null
			// The group chip is an exact constraint. Starting with an empty text
			// query avoids accidentally carrying a group-table search into members.

			editor.selected.clear()
			editor.selectionAnchor = null
			editor.pendingRangeSelection = null
			editor.kindButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.dataKind === "genes")))

		const showEditorTab = (name) => {

			editor.panels.forEach((panel) => { panel.hidden = panel.dataset.editorPanel !== name })

		// This is intentionally a context-menu action, rather than changing a
		// normal plot click: ordinary clicks keep their established anchor-map
		// behaviour while an explicit action provides a dependable path back to
		// the record that is being inspected.
		const revealInEditor = (kind, record) => {
			if (!record) return
			const data = chart.data()
			const uid = record.uid
			const rowKey = `${kind === "groups" ? "group" : "gene"}:${uid}`
			if (kind === "genes") {
				editor.geneMode = "tree"
				const cluster = data?.clusters.find((candidate) => candidate.loci.some((locus) =>

				const locus = cluster?.loci.find((candidate) => candidate.genes.some((gene) => gene.uid === uid))

						editor.expanded.add(`cluster-locus:${cluster.uid}:${locus.uid}`)

						editor.expanded.add(`cluster:${cluster.uid}`)

			editor.identityKey = null

			editor.geneViewButtons.forEach((button) => button.setAttribute("aria-pressed", String(kind === "genes" && button.dataset.geneView === "tree")))

			const index = editor.allRows.findIndex((row) => row.key === rowKey)

				editor.viewport.scrollTop = Math.max(0, (index - Math.floor(viewportRows / 2)) * editor.rowHeight)
				renderEditor({ refresh: false })
			}
			syncGeneHighlight()
		}
		chart.config({
			gene: { shape: { onReveal: (gene) => revealInEditor("genes", gene) } },
			legend: { onReveal: (group) => revealInEditor("groups", group) },
		})
		const configAtPath = (config, path) => path.split(".").reduce((value, key) => value?.[key], config)
		const configChange = (path, value) => path.split(".").reverse().reduce((nested, key) => ({ [key]: nested }), value)
		const appearanceValue = (field) => {
			if (field.type === "checkbox") return field.checked
			if (field.type === "number" || field.type === "range") return Number(field.value) / (field.dataset.percent !== undefined ? 100 : 1)
			return field.value
		}
		const syncAppearanceControls = () => {
			const config = chart.config()
			editor.appearanceFields.forEach((field) => {
				const value = configAtPath(config, field.dataset.config)
				if (field.type === "checkbox") field.checked = Boolean(value)
				else if (field.type === "color") field.value = colourInputValue(value)
				else field.value = field.dataset.percent !== undefined ? Number(value ?? 0) * 100 : value ?? ""
				if (field.dataset.identityBound) field.disabled = config.colourBar.domain[`${field.dataset.identityBound}Mode`] === "data"
				if (field.dataset.output !== undefined) field.parentElement.querySelector("output")?.replaceChildren(Number(value).toFixed(2))
			})
		}
		const filterAppearanceControls = () => {
			const needle = editor.appearanceFilter.value.trim().toLowerCase()
			editor.appearanceFilterClear.hidden = !needle
			document.querySelectorAll("#appearance-controls fieldset").forEach((fieldset) => {
				const sectionMatches = fieldset.querySelector("legend")?.textContent.toLowerCase().includes(needle)
				let visibleLabels = 0
				fieldset.querySelectorAll("label").forEach((label) => {
					const matches = !needle || sectionMatches || label.textContent.toLowerCase().includes(needle)
					label.hidden = !matches
					if (matches) visibleLabels += 1
				})
				fieldset.hidden = visibleLabels === 0
				fieldset.querySelectorAll("details").forEach((details) => {
					const hasVisibleAdvanced = [...details.querySelectorAll("label")].some((label) => !label.hidden)
					details.hidden = Boolean(needle) && !hasVisibleAdvanced
					if (needle && hasVisibleAdvanced && !details.open) {
						details.open = true
						details.dataset.autoOpened = "true"
					} else if (!needle && details.dataset.autoOpened) {
						details.open = false
						delete details.dataset.autoOpened
					}
				})
			})
		}
		const updateAppearance = (options) => {
			chart.config(options)
			syncAppearanceControls()
		}
		editor.button.addEventListener("click", () => {
			const visible = editor.root.hidden
			editor.root.hidden = !visible
			editor.button.setAttribute("aria-expanded", String(visible))
			if (visible) renderEditor()
		})
		if (editorEnabled) editor.button.click()
		editor.tabs.forEach((tab) => tab.addEventListener("click", () => showEditorTab(tab.dataset.editorTab)))
		let editorResize = null
		editor.resizeHandle.addEventListener("pointerdown", (event) => {
			editorResize = { pointerId: event.pointerId, y: event.clientY, height: editor.root.getBoundingClientRect().height }
			editor.resizeHandle.setPointerCapture(event.pointerId)
			document.body.style.cursor = "ns-resize"
		})
		editor.resizeHandle.addEventListener("pointermove", (event) => {
			if (!editorResize || event.pointerId !== editorResize.pointerId) return
			const toolbarHeight = document.querySelector("#toolbar").getBoundingClientRect().height
			const height = Math.max(180, Math.min(window.innerHeight - toolbarHeight - 80, editorResize.height + editorResize.y - event.clientY))
			editor.root.style.height = `${height}px`
			renderEditor({ refresh: false })
		})
		const stopEditorResize = (event) => {
			if (!editorResize || event.pointerId !== editorResize.pointerId) return
			editorResize = null
			document.body.style.cursor = ""
		}
		editor.resizeHandle.addEventListener("pointerup", stopEditorResize)
		editor.resizeHandle.addEventListener("pointercancel", stopEditorResize)
		editor.kindButtons.forEach((button) => button.addEventListener("click", () => {
			editor.kind = button.dataset.dataKind
			editor.creatingGroup = false
			editor.creatingStandaloneGroup = false
			editor.renameKey = null
			editor.identityKey = null
			editor.selected.clear()
			editor.selectionAnchor = null
			editor.pendingRangeSelection = null
			syncGeneHighlight()
			editor.kindButtons.forEach((candidate) => candidate.setAttribute("aria-pressed", String(candidate === button)))
			editor.viewport.scrollTop = 0
			renderEditor()
		}))
		editor.geneViewButtons.forEach((button) => button.addEventListener("click", () => {
			editor.geneMode = button.dataset.geneView
			editor.renameKey = null
			editor.identityKey = null
			editor.geneViewButtons.forEach((candidate) => candidate.setAttribute("aria-pressed", String(candidate === button)))
			editor.viewport.scrollTop = 0
			renderEditor()
		}))
		const expandVisibleTree = () => {
			const data = chart.data()
			if (!data || editor.kind !== "genes" || editor.geneMode === "list") return
			if (editor.geneMode === "groups") {
				data.groups.forEach((group) => editor.expanded.add(`gene-group:${group.uid}`))
				editor.expanded.add("gene-group:ungrouped")
			} else {
				data.clusters.forEach((cluster) => {
					if (cluster.loci.length === 1) {
						editor.expanded.add(`cluster-locus:${cluster.uid}:${cluster.loci[0].uid}`)
						return
					}
					editor.expanded.add(`cluster:${cluster.uid}`)
					cluster.loci.forEach((locus) => editor.expanded.add(`locus:${locus.uid}`))
				})
			}
			renderEditor()
		}
		const collapseAllTree = () => {
			if (editor.kind !== "genes" || editor.geneMode === "list") return
			editor.expanded.clear()
			renderEditor()
		}
		editor.treeToggleAll.addEventListener("click", () => {
			const hasCollapsedTreeBranch = editor.allRows.some((row) => row.expandable && !row.expanded)
			if (hasCollapsedTreeBranch) expandVisibleTree()
			else collapseAllTree()
		})
		editor.listHeader.addEventListener("click", (event) => {
			const column = event.target.closest("[data-sort-column]")?.dataset.sortColumn
			if (!column) return
			editor.sort.direction = editor.sort.column === column ? -editor.sort.direction : 1
			editor.sort.column = column
			editor.viewport.scrollTop = 0
			renderEditor()
		})
		const clearEditorFilter = ({ focus = false } = {}) => {
			if (!editor.filter.value) return
			editor.filter.value = ""
			editor.viewport.scrollTop = 0
			renderEditor()
			if (focus) editor.filter.focus()
		}
		editor.filter.addEventListener("input", () => { editor.viewport.scrollTop = 0; renderEditor() })
		editor.filter.addEventListener("keydown", (event) => {
			if (event.key === "Escape") clearEditorFilter({ focus: true })
		})
		editor.filterClear.addEventListener("click", () => clearEditorFilter({ focus: true }))
		editor.memberGroupFilterClear.addEventListener("click", () => {
			editor.memberGroupUid = null
			editor.viewport.scrollTop = 0
			renderEditor()
		})
		editor.viewport.addEventListener("scroll", () => renderEditor({ refresh: false }))
		const selectAllVisibleRows = () => {
			editor.allRows.flatMap((row) => row.selectIds).forEach((uid) => editor.selected.add(uid))
			editor.selectionAnchor = editor.allRows[0]?.key || null
			syncGeneHighlight()
			renderEditor({ refresh: false })
		}
		const clearRowSelection = () => {
			if (!editor.selected.size) return
			editor.selected.clear()
			editor.selectionAnchor = null
			editor.pendingRangeSelection = null
			syncGeneHighlight()
			renderEditor({ refresh: false })
		}
		editor.selectAllVisible.addEventListener("click", () => {
			selectAllVisibleRows()
		})
		editor.viewport.addEventListener("keydown", (event) => {
			const editable = event.target.matches('input:not([type="checkbox"]), textarea, select, [contenteditable="true"]')
			if (editable) return
			if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "a") {
				event.preventDefault()
				selectAllVisibleRows()
				return
			}
			if (event.key === "Escape" && editor.selected.size) {
				event.preventDefault()
				clearRowSelection()
			}
		})
		const beginRowRename = (key) => {
			if (!recordForRenameKey(key)) return
			editor.renameKey = key
			renderEditor({ refresh: false })
			requestAnimationFrame(() => {
				const input = editor.rows.querySelector(`[data-row-rename="${CSS.escape(key)}"]`)
				input?.focus()
				input?.select()
			})
		}
		const finishRowRename = (key, value) => {
			if (editor.renameKey !== key) return
			editor.renameKey = null
			applyRowRename(key, value)
			renderEditor()
		}
		const beginRowIdentityEdit = (key) => {
			if (!editor.rowByKey.has(key)) return
			editor.identityKey = key
			renderEditor({ refresh: false })
			requestAnimationFrame(() => {
				const input = editor.rows.querySelector(`[data-row-identity="${CSS.escape(key)}"]`)
				input?.focus()
				input?.select()
			})
		}
		const finishRowIdentityEdit = (key, value) => {
			if (editor.identityKey !== key) return
			editor.identityKey = null
			const identity = Number(value)
			const row = editor.rowByKey.get(key)
			if (row && Number.isFinite(identity) && identity >= 0 && identity <= 100) {
				applyChanges(row.selectIds, { identity: identity / 100 })
			} else {
				renderEditor({ refresh: false })
			}
		}
		editor.rows.addEventListener("pointerover", (event) => {
			if (editor.kind !== "genes" && editor.kind !== "links") return
			const rowNode = event.target.closest("[data-row-key]")
			if (!rowNode || rowNode.contains(event.relatedTarget)) return
			const row = editor.rowByKey.get(rowNode.dataset.rowKey)
			if (row) chart.highlight(editor.kind === "links" ? { links: row.selectIds } : { genes: row.selectIds })
		})
		editor.rows.addEventListener("pointerout", (event) => {
			if (editor.kind !== "genes" && editor.kind !== "links") return
			const rowNode = event.target.closest("[data-row-key]")
			if (!rowNode || rowNode.contains(event.relatedTarget)) return
			syncGeneHighlight()
		})
		editor.rows.addEventListener("click", (event) => {
			const target = event.target
			if (target.closest("[data-clear-filter]")) {
				clearEditorFilter({ focus: true })
				return
			}
			const rowSelectKey = target.closest("[data-row-select]")?.dataset.rowSelect
			if (rowSelectKey) {
				editor.pendingRangeSelection = { key: rowSelectKey, range: event.shiftKey }
				return
			}
			const key = target.closest("[data-tree-toggle]")?.dataset.treeToggle
			if (key) {
				editor.expanded.has(key) ? editor.expanded.delete(key) : editor.expanded.add(key)
				renderEditor()
				return
			}
			if (target.dataset.rowBeginRename) {
				beginRowRename(target.dataset.rowBeginRename)
				return
			}
			const identityKey = target.closest("[data-row-begin-identity]")?.dataset.rowBeginIdentity
			if (identityKey) {
				beginRowIdentityEdit(identityKey)
				return
			}
			const visibilityKey = target.closest("[data-row-visibility]")?.dataset.rowVisibility
			if (visibilityKey) {
				const row = editor.rowByKey.get(visibilityKey)
				applyChanges(row.selectIds, { hidden: !row.hidden })
				return
			}
			if (target.dataset.rowColour || target.matches("input") || target.closest(".row-label")) return
			const row = target.closest("[data-row-key]") && editor.rowByKey.get(target.closest("[data-row-key]").dataset.rowKey)
			if (!row) return
			updateRowSelection(row, { selected: !selectedFor(row), range: event.shiftKey })
			syncGeneHighlight()
			renderEditor({ refresh: false })
			editor.viewport.focus({ preventScroll: true })
		})
		editor.rows.addEventListener("dblclick", (event) => {
			const label = event.target.closest(".row-label")
			if (!label) return
			event.preventDefault()
			beginRowRename(label.dataset.rowRenameKey)
		})
		editor.rows.addEventListener("keydown", (event) => {
			const input = event.target.closest("[data-row-rename]")
			if (input && event.key === "Enter") {
				event.preventDefault()
				finishRowRename(input.dataset.rowRename, input.value)
			} else if (input && event.key === "Escape") {
				event.preventDefault()
				editor.renameKey = null
				renderEditor({ refresh: false })
			}
			const identity = event.target.closest("[data-row-identity]")
			if (identity && event.key === "Enter") {
				event.preventDefault()
				finishRowIdentityEdit(identity.dataset.rowIdentity, identity.value)
			} else if (identity && event.key === "Escape") {
				event.preventDefault()
				editor.identityKey = null
				renderEditor({ refresh: false })
			}
		})
		editor.rows.addEventListener("focusout", (event) => {
			const input = event.target.closest("[data-row-rename]")
			if (input) finishRowRename(input.dataset.rowRename, input.value)
			const identity = event.target.closest("[data-row-identity]")
			if (identity) finishRowIdentityEdit(identity.dataset.rowIdentity, identity.value)
		})
		editor.rows.addEventListener("change", (event) => {
			const target = event.target
			if (target.dataset.rowSelect) {
				const row = editor.rowByKey.get(target.dataset.rowSelect)
				const range = editor.pendingRangeSelection?.key === row.key && editor.pendingRangeSelection.range
				editor.pendingRangeSelection = null
				updateRowSelection(row, { selected: target.checked, range })
				syncGeneHighlight()
				renderEditor({ refresh: false })
				return
			}
			if (target.dataset.rowIdentity) {
				finishRowIdentityEdit(target.dataset.rowIdentity, target.value)
				return
			}
			if (!target.dataset.rowColour) return
			const row = editor.rowByKey.get(target.dataset.rowColour)
			applyChanges(row.selectIds, { colour: target.value })
		})
		editor.selectionRename.addEventListener("click", () => {
			if (!editor.selectionLabel.value) return
			applyChanges([...editor.selected], { label: editor.selectionLabel.value })
			editor.selectionLabel.value = ""
		})
		editor.selectionLabel.addEventListener("keydown", (event) => {
			if (event.key === "Enter") editor.selectionRename.click()
		})
		editor.selectionColour.addEventListener("change", () => applyChanges([...editor.selected], { colour: editor.selectionColour.value }))
		editor.selectionSetIdentity.addEventListener("click", () => {
			const identity = Number(editor.selectionIdentity.value)
			if (!Number.isFinite(identity) || identity < 0 || identity > 100) return
			applyChanges([...editor.selected], { identity: identity / 100 })
			editor.selectionIdentity.value = ""
		})
		editor.selectionIdentity.addEventListener("keydown", (event) => {
			if (event.key === "Enter") editor.selectionSetIdentity.click()
		})
		editor.selectionVisibility.addEventListener("change", () => {
			if (!editor.selectionVisibility.value) return
			applyChanges([...editor.selected], { hidden: editor.selectionVisibility.value === "hide" })
			editor.selectionVisibility.value = ""
		})
		editor.groupBeginCreate.addEventListener("click", () => {
			editor.creatingStandaloneGroup = true
			renderEditor({ refresh: false })
			editor.newGroupName.focus()
		})
		editor.groupCancelCreate.addEventListener("click", () => {
			editor.creatingStandaloneGroup = false
			editor.newGroupName.value = ""
			renderEditor({ refresh: false })
		})
		editor.newGroupCreate.addEventListener("click", () => {
			if (createGroup(editor.newGroupName.value)) {
				editor.newGroupName.value = ""
				editor.creatingStandaloneGroup = false
				renderEditor({ refresh: false })
			}
		})
		editor.newGroupName.addEventListener("keydown", (event) => {
			if (event.key === "Enter") editor.newGroupCreate.click()
		})
		editor.selectionAssign.addEventListener("click", () => {
			const groupId = groupUidForValue(editor.selectionGroup.value)
			if (groupId === undefined) return
			editor.selectionGroup.value = ""
			applyMembershipChange({ type: "groups.assignGenes", groupId, geneIds: [...editor.selected] })
		})
		editor.selectionGroup.addEventListener("change", () => {
			editor.selectionAssign.disabled = !editor.selectionGroup.value
		})
		editor.selectionUnassign.addEventListener("click", () => {
			applyMembershipChange({ type: "groups.unassignGenes", geneIds: [...editor.selected] })
		})
		editor.selectionBeginCreateGroup.addEventListener("click", () => {
			editor.creatingGroup = true
			renderEditor({ refresh: false })
			editor.selectionNewGroup.focus()
		})
		editor.selectionCreateGroup.addEventListener("click", () => {
			if (createGroup(editor.selectionNewGroup.value, [...editor.selected])) {
				editor.selectionNewGroup.value = ""
				editor.creatingGroup = false
				renderEditor({ refresh: false })
			}
		})
		editor.selectionNewGroup.addEventListener("keydown", (event) => {
			if (event.key === "Enter") editor.selectionCreateGroup.click()
		})
		editor.selectionDeleteGenes.addEventListener("click", () => {
			const geneIds = [...editor.selected]
			if (!geneIds.length) return
			if (!window.confirm(`Delete ${geneIds.length} gene${geneIds.length === 1 ? "" : "s"} from the plot? Links will be kept in the data.`)) return
			applyMembershipChange({ type: "genes.delete", ids: geneIds }, { clearSelection: true })
		})
		editor.selectionDeleteLinks.addEventListener("click", () => {
			const ids = [...editor.selected]
			if (!ids.length) return
			if (!window.confirm(`Delete ${ids.length} link${ids.length === 1 ? "" : "s"}? This does not delete genes.`)) return
			applyMembershipChange({ type: "links.delete", ids }, { clearSelection: true })
		})
		editor.selectionMerge.addEventListener("click", () => {
			const targetId = groupUidForValue(editor.selectionMergeTarget.value)
			if (targetId === undefined) return
			editor.selectionMergeTarget.value = ""
			applyMembershipChange({
				type: "groups.merge",
				targetId,
				sourceIds: [...editor.selected],
			}, { clearSelection: true })
		})
		editor.selectionMergeTarget.addEventListener("change", () => {
			editor.selectionMerge.disabled = !editor.selectionMergeTarget.value
		})
		editor.selectionDelete.addEventListener("click", () => {
			applyMembershipChange({ type: "groups.delete", ids: [...editor.selected] }, { clearSelection: true })
		})
		editor.selectionFocus.addEventListener("click", focusSelectionInPlot)
		editor.selectionViewMembers.addEventListener("click", viewSelectedGroupMembers)
		editor.selectionClear.addEventListener("click", clearRowSelection)
		editor.selectionUndo.addEventListener("click", () => {
			const change = editor.history.pop()
			if (!change) return
			chart.patch(operationsForValues(change.operation.type, change.before))
			editor.future.push(change)
			renderEditor()
		})
		editor.selectionRedo.addEventListener("click", () => {
			const change = editor.future.pop()
			if (!change) return
			chart.patch([change.operation])
			editor.history.push(change)
			renderEditor()
		})
		editor.appearanceFields.forEach((field) => {
			field.addEventListener("input", () => {
				if (field.dataset.output !== undefined) field.parentElement.querySelector("output")?.replaceChildren(Number(field.value).toFixed(2))
			})
			field.addEventListener("change", () => updateAppearance(configChange(field.dataset.config, appearanceValue(field))))
		})
		editor.appearanceFilter.addEventListener("input", filterAppearanceControls)
		editor.appearanceFilterClear.addEventListener("click", () => {
			editor.appearanceFilter.value = ""
			filterAppearanceControls()
			editor.appearanceFilter.focus()
		})

		data
			.then(data => {
				// Exposed only in test mode for browser assertions.
				if (testMode) window.__demoChart = chart
				div.selectAll("div")
					.data([data])
					.join("div")
					.attr("class", "chart-host")
					.call(chart)
				const geneCount = chart.data().clusters.flatMap((cluster) => cluster.loci).reduce((count, locus) => count + locus.genes.length, 0)
				// A small fixture is immediately inspectable; a biological-scale tree
				// starts collapsed and search expands only matching branches.
				if (geneCount <= 500) chart.data().clusters.forEach((cluster) => {
					editor.expanded.add(`cluster:${cluster.uid}`)
					cluster.loci.forEach((locus) => editor.expanded.add(`locus:${locus.uid}`))
				})
				chart.on("change", renderEditor)
				renderEditor()
				syncAppearanceControls()
				filterAppearanceControls()

				d3.select("#btn-save-svg")
					.on("click", () => {
						const blob = new Blob([chart.exportSvg()], {type: "image/svg+xml"})
						download(blob, "clinker.svg")
					})
			})

	</script>
</html>
