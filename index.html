<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>clinker</title>
    <script type="importmap">
      { "imports": {
        "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
        "d3-array": "https://cdn.jsdelivr.net/npm/d3-array@3.2.4/+esm",
        "d3-color": "https://cdn.jsdelivr.net/npm/d3-color@3.1.0/+esm",
        "d3-drag": "https://cdn.jsdelivr.net/npm/d3-drag@3.0.0/+esm",
        "d3-scale": "https://cdn.jsdelivr.net/npm/d3-scale@4.0.2/+esm",
        "d3-scale-chromatic": "https://cdn.jsdelivr.net/npm/d3-scale-chromatic@3.1.0/+esm",
        "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@3.0.0/+esm",
        "d3-transition": "https://cdn.jsdelivr.net/npm/d3-transition@3.0.1/+esm",
        "d3-zoom": "https://cdn.jsdelivr.net/npm/d3-zoom@3.0.0/+esm"
      } }
    </script>
    <link rel="stylesheet" href="./dist/editor.css">
    <style>
      html, body, main { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; }
      main { position: relative; display: flex; flex-direction: column; }
      #toolbar { display: flex; align-items: center; gap: 6px; padding: 5px; font: 13px system-ui, sans-serif; }
      #toolbar button { min-height: 30px; border: 1px solid #cbd3de; border-radius: 6px; padding: 4px 8px; background: #fff; color: #273444; font: inherit; cursor: pointer; }
      #toolbar button:hover { border-color: #78a9ed; background: #f4f8ff; }
      #data-import-status { color: #536b88; font-size: 12px; }
      #data-import-status[data-error="true"] { color: #b42318; }
      #workspace { position: relative; display: flex; flex: 1; min-height: 0; }
      #plot, #plot > .chart-host { width: 100%; height: 100%; }
      #plot { flex: 1; min-height: 0; }
      clinker-editor { position: absolute; z-index: 3; right: 12px; bottom: 12px; left: 12px; height: min(360px, 42vh); max-height: calc(100% - 48px); box-shadow: 0 8px 28px rgba(23,36,54,.16); }
    </style>
  </head>
  <body>
    <main>
      <div id="toolbar">
        <button id="btn-save-svg">Export SVG</button>
        <button id="btn-export-data">Export data</button>
        <button id="btn-export-project">Export project</button>
        <button id="btn-import-data">Load data…</button>
        <input id="data-import-file" type="file" accept="application/json,.json" hidden>
        <button id="btn-import-project">Load project…</button>
        <input id="project-import-file" type="file" accept="application/json,.json" hidden>
        <span id="data-import-status" role="status" aria-live="polite"></span>
        <button id="btn-editor" aria-expanded="false">Edit data</button>
      </div>
      <div id="workspace"><div id="plot"></div></div>
      <clinker-editor id="editor" resizable hidden></clinker-editor>
    </main>
    <script type="module">
      import * as d3 from "d3";
      import { ClusterMap } from "./dist/clustermap.mjs";
      import { defineClinkerEditor, mountPlotSelectionToolbar } from "./dist/editor.mjs";
      import { createLargeTestingData } from "./largeTestingData.mjs";

      const params = new URLSearchParams(location.search);
      const testMode = params.has("test");
      const fixture = params.get("fixture");
      const biologicalFixtures = { mcaa: "fixtures/mcaa-neighbourhoods-173.json", pks: "fixtures/pks-regions-142.json" };
      const biologicalFixture = biologicalFixtures[fixture];
      const renderer = params.get("renderer") || (fixture === "large" || biologicalFixture ? "canvas" : "svg");
      const minZoom = Number(params.get("minZoom"));
      const chart = ClusterMap().config({
        plot: { transitionDuration: testMode ? 0 : 250, renderer, minZoom: Number.isFinite(minZoom) ? minZoom : 0, minimap: { show: params.has("minimap") } },
        cluster: { alignLabels: false },
        gene: { label: { show: false } },
        legend: { show: true, position: fixture === "large" || biologicalFixture ? "bottom" : "right", columns: biologicalFixture ? 8 : 1 },
        link: { threshold: 0.3, bestOnly: true },
      });
      const source = fixture === "large" ? Promise.resolve(createLargeTestingData()) : biologicalFixture ? d3.json(biologicalFixture) : d3.json("testing.json");
      const download = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const anchor = Object.assign(document.createElement("a"), { href: url, download: filename });
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      };
      const validateData = (data) => {
        if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("the file must contain a JSON object");
        if (!Array.isArray(data.clusters) || !Array.isArray(data.links) || !Array.isArray(data.groups)) throw new Error("expected clusters, links, and groups arrays");
        if (!data.clusters.every((cluster) => Array.isArray(cluster?.loci) && cluster.loci.every((locus) => Array.isArray(locus?.genes)))) throw new Error("each cluster must contain loci with genes arrays");
      };
      const loadFile = (button, input, validate, apply, noun) => {
        button.addEventListener("click", () => input.click());
        input.addEventListener("change", async () => {
          const [file] = input.files;
          input.value = "";
          if (!file) return;
          try {
            const value = JSON.parse(await file.text());
            validate(value);
            apply(value);
            status.textContent = `Loaded ${noun} ${file.name}`;
            status.dataset.error = "false";
          } catch (error) {
            status.textContent = `Could not load ${file.name}: ${error.message}`;
            status.dataset.error = "true";
          }
        });
      };

      defineClinkerEditor();
      const editor = document.querySelector("clinker-editor");
      const status = document.querySelector("#data-import-status");
      source.then((data) => {
        if (testMode) { window.__demoChart = chart; window.d3 = d3; }
        d3.select("#plot").selectAll("div").data([data]).join("div").attr("class", "chart-host").call(chart);
        editor.chart = chart;
        mountPlotSelectionToolbar(chart, document.querySelector("#workspace"));
        document.querySelector("#btn-editor").addEventListener("click", () => {
          editor.hidden = !editor.hidden;
          document.querySelector("#btn-editor").setAttribute("aria-expanded", String(!editor.hidden));
        });
        if (params.has("editor")) document.querySelector("#btn-editor").click();
        document.querySelector("#btn-save-svg").addEventListener("click", () => download(new Blob([chart.exportSvg()], { type: "image/svg+xml" }), "clinker.svg"));
        document.querySelector("#btn-export-data").addEventListener("click", () => download(new Blob([`${JSON.stringify(chart.data(), null, 2)}\n`], { type: "application/json" }), "clinker-data.json"));
        document.querySelector("#btn-export-project").addEventListener("click", () => download(new Blob([`${JSON.stringify(chart.project(), null, 2)}\n`], { type: "application/json" }), "clinker-project.json"));
        loadFile(document.querySelector("#btn-import-data"), document.querySelector("#data-import-file"), validateData, (value) => chart.data(value), "data");
        loadFile(document.querySelector("#btn-import-project"), document.querySelector("#project-import-file"), (value) => {
          if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("the file must contain a project object");
          if (value.format !== "clinker-project" || value.version !== 1) throw new Error("unsupported project format");
          if (!value.config || typeof value.config !== "object" || Array.isArray(value.config)) throw new Error("the project needs appearance settings");
          validateData(value.data);
        }, (value) => chart.project(value), "project");
      });
    </script>
  </body>
</html>
