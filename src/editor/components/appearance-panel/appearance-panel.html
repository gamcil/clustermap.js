<div class="toolbar" part="toolbar"><clinker-search-field data-appearance-filter label="Find an appearance setting" placeholder="Find a setting"></clinker-search-field></div>
<div class="settings" part="settings">
  <fieldset data-appearance-section="plot">
    <legend>Plot</legend>
    <label><span>Show figure frame</span><input type="checkbox" data-config="plot.showFigureFrame" aria-label="Show figure border and dimensions"></label>
    <label><span>Figure background</span><input type="color" data-config="plot.background" aria-label="Figure background"></label>
    <label><span>Enable annotation panels</span><input type="checkbox" data-config="annotations.enabled" aria-label="Enable annotation panels"></label>
  </fieldset>
  <fieldset data-appearance-section="legend">
    <legend>Legend</legend>
    <label><span>Show legend</span><input type="checkbox" data-config="legend.show" aria-label="Show legend"></label>
    <label><span>Position</span><select data-config="legend.position" aria-label="Position"><option value="right">right</option><option value="bottom">bottom</option></select></label>
    <label><span>Columns</span><input type="number" step="any" data-config="legend.columns" aria-label="Columns"></label>
    <details data-appearance-section="legend">
      <summary>Advanced</summary>
      <label><span>Column width</span><input type="number" step="any" data-config="legend.columnWidth" aria-label="Column width"></label>
      <label><span>Entry height</span><input type="number" step="any" data-config="legend.entryHeight" aria-label="Entry height"></label>
      <label><span>Font size</span><input type="number" step="any" data-config="legend.fontSize" aria-label="Font size"></label>
      <label><span>Subtitle size</span><input type="number" step="any" data-config="legend.subtitleFontSize" aria-label="Subtitle size"></label>
      <label><span>Left margin</span><input type="number" step="any" data-config="legend.marginLeft" aria-label="Left margin"></label>
      <label><span>Top margin</span><input type="number" step="any" data-config="legend.marginTop" aria-label="Top margin"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="links">
    <legend>Links</legend>
    <label><span>Show links</span><input type="checkbox" data-config="link.show" aria-label="Show links"></label>
    <label><span>Draw as lines</span><input type="checkbox" data-config="link.asLine" aria-label="Draw as lines"></label>
    <label><span>Best match only</span><input type="checkbox" data-config="link.bestOnly" aria-label="Best match only"></label>
    <label><span>Minimum identity</span><input type="number" step="any" data-config="link.threshold" aria-label="Minimum identity"></label>
    <details data-appearance-section="links">
      <summary>Advanced</summary>
      <label><span>Straight links</span><input type="checkbox" data-config="link.straight" aria-label="Straight links"></label>
      <label><span>Use group colour</span><input type="checkbox" data-config="link.groupColour" aria-label="Use group colour"></label>
      <label><span>Stroke width</span><input type="number" step="any" data-config="link.strokeWidth" aria-label="Stroke width"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="link-labels">
    <legend>Link labels</legend>
    <label><span>Show link labels</span><input type="checkbox" data-config="link.label.show" aria-label="Show link labels"></label>
    <details data-appearance-section="link-labels">
      <summary>Advanced</summary>
      <label><span>Label background</span><input type="checkbox" data-config="link.label.background" aria-label="Label background"></label>
      <label><span>Font size</span><input type="number" step="any" data-config="link.label.fontSize" aria-label="Font size"></label>
      <label><span>Position</span><input type="number" step="any" data-config="link.label.position" aria-label="Position"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="tree">
    <legend>Tree</legend>
    <label><span>Show tree</span><input type="checkbox" data-config="tree.show" aria-label="Show tree"></label>
    <label><span>Show tree nodes</span><input type="checkbox" data-config="tree.node.show" aria-label="Show tree nodes"></label>
    <label><span>Show root stem</span><input type="checkbox" data-config="tree.rootStem.show" aria-label="Show root stem"></label>
    <label><span>Tree width</span><input type="number" step="any" data-config="tree.width" aria-label="Tree width"></label>
    <label><span>Use branch lengths</span><input type="checkbox" data-config="tree.useBranchLengths" aria-label="Use branch lengths"></label>
    <label><span>Branch stroke width</span><input type="number" step="any" data-config="tree.branch.width" aria-label="Branch stroke width"></label>
    <label><span>Branch colour</span><input type="color" data-config="tree.branch.colour" aria-label="Branch colour"></label>
    <label><span>Show support values</span><input type="checkbox" data-config="tree.support.show" aria-label="Show support values"></label>
    <label><span>Show tree scale bar</span><input type="checkbox" data-config="tree.scaleBar.show" aria-label="Show tree scale bar"></label>
    <label><span>Show dashed leaf guides</span><input type="checkbox" data-config="tree.leafGuide.show" aria-label="Show dashed leaf guides"></label>
    <details data-appearance-section="tree">
      <summary>Advanced</summary>
      <label><span>Support font size</span><input type="number" step="any" data-config="tree.support.fontSize" aria-label="Support font size"></label>
      <label><span>Support precision</span><input type="number" step="any" data-config="tree.support.precision" aria-label="Support precision"></label>
      <label><span>Leaf guide colour</span><input type="color" data-config="tree.leafGuide.colour" aria-label="Leaf guide colour"></label>
      <label><span>Leaf guide width</span><input type="number" step="any" data-config="tree.leafGuide.width" aria-label="Leaf guide width"></label>
      <label><span>Leaf guide dash pattern</span><input type="text" data-config="tree.leafGuide.dash" aria-label="Leaf guide dash pattern"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="clusters-loci">
    <legend>Clusters &amp; loci</legend>
    <label><span>Align cluster labels</span><input type="checkbox" data-config="cluster.alignLabels" aria-label="Align cluster labels"></label>
    <label><span>Label alignment</span><select data-config="cluster.labelAlignment" aria-label="Label alignment"><option value="right">Right</option><option value="left">Left</option></select></label>
    <label><span>Hide locus labels</span><input type="checkbox" data-config="cluster.hideLocusLabels" aria-label="Hide locus labels"></label>
    <label><span>Hide locus coordinates</span><input type="checkbox" data-config="cluster.hideLocusCoordinates" aria-label="Hide locus coordinates"></label>
    <label><span>Show trim indicators</span><input type="checkbox" data-config="locus.trimIndicators.show" aria-label="Show trim indicators"></label>
    <label><span>Cluster spacing</span><input type="number" step="any" data-config="cluster.spacing" aria-label="Cluster spacing"></label>
    <label><span>Locus spacing</span><input type="number" step="any" data-config="locus.spacing" aria-label="Locus spacing"></label>
    <details data-appearance-section="clusters-loci">
      <summary>Advanced</summary>
      <label><span>Cluster name size</span><input type="number" step="any" data-config="cluster.nameFontSize" aria-label="Cluster name size"></label>
      <label><span>Locus label size</span><input type="number" step="any" data-config="cluster.lociFontSize" aria-label="Locus label size"></label>
      <label><span>Trim indicator size</span><input type="number" step="any" data-config="locus.trimIndicators.fontSize" aria-label="Trim indicator size"></label>
      <label><span>Trim indicator weight</span><input type="number" step="any" data-config="locus.trimIndicators.fontWeight" aria-label="Trim indicator weight"></label>
      <label><span>Trim indicator border</span><input type="number" step="any" data-config="locus.trimIndicators.borderWidth" aria-label="Trim indicator border"></label>
      <label><span>Trim indicator border opacity</span><input type="number" step="any" data-config="locus.trimIndicators.borderOpacity" aria-label="Trim indicator border opacity"></label>
      <label><span>Track colour</span><input type="color" data-config="locus.trackBar.colour" aria-label="Track colour"></label>
      <label><span>Track stroke</span><input type="number" step="any" data-config="locus.trackBar.stroke" aria-label="Track stroke"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="genes">
    <legend>Genes</legend>
    <label><span>Show gene labels</span><input type="checkbox" data-config="gene.label.show" aria-label="Show gene labels"></label>
    <label><span>Label field</span><select data-config="gene.label.name" aria-label="Label field"><option value="uid">uid</option><option value="name">name</option><option value="label">label</option></select></label>
    <label><span>Label position</span><select data-config="gene.label.position" aria-label="Label position"><option value="top">top</option><option value="bottom">bottom</option></select></label>
    <details data-appearance-section="genes">
      <summary>Advanced</summary>
      <label><span>Label anchor</span><select data-config="gene.label.anchor" aria-label="Label anchor"><option value="start">start</option><option value="middle">middle</option><option value="end">end</option></select></label>
      <label><span>Label size</span><input type="number" step="any" data-config="gene.label.fontSize" aria-label="Label size"></label>
      <label><span>Label rotation</span><input type="number" step="any" data-config="gene.label.rotation" aria-label="Label rotation"></label>
      <label><span>Label spacing</span><input type="number" step="any" data-config="gene.label.spacing" aria-label="Label spacing"></label>
      <label><span>Label start</span><input type="number" step="any" data-config="gene.label.start" aria-label="Label start"></label>
      <label><span>Body height</span><input type="number" step="any" data-config="gene.shape.bodyHeight" aria-label="Body height"></label>
      <label><span>Tip height</span><input type="number" step="any" data-config="gene.shape.tipHeight" aria-label="Tip height"></label>
      <label><span>Tip length</span><input type="number" step="any" data-config="gene.shape.tipLength" aria-label="Tip length"></label>
      <label><span>Stroke colour</span><input type="color" data-config="gene.shape.stroke" aria-label="Stroke colour"></label>
      <label><span>Stroke width</span><input type="number" step="any" data-config="gene.shape.strokeWidth" aria-label="Stroke width"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="scale-bars">
    <legend>Scale bars</legend>
    <label><span>Show scale bar</span><input type="checkbox" data-config="scaleBar.show" aria-label="Show scale bar"></label>
    <label><span>Base pairs</span><input type="number" step="any" data-config="scaleBar.basePair" aria-label="Base pairs"></label>
    <label><span>Show identity bar</span><input type="checkbox" data-config="colourBar.show" aria-label="Show identity bar"></label>
    <label><span>Minimum source</span><select data-config="colourBar.domain.minMode" aria-label="Minimum source"><option value="fixed">Custom value</option><option value="data">Lowest identity in data</option></select></label>
    <label><span>Minimum identity</span><input type="number" step="any" data-config="colourBar.domain.min" aria-label="Minimum identity"></label>
    <label><span>Maximum source</span><select data-config="colourBar.domain.maxMode" aria-label="Maximum source"><option value="fixed">Custom value</option><option value="data">Highest identity in data</option></select></label>
    <label><span>Maximum identity</span><input type="number" step="any" data-config="colourBar.domain.max" aria-label="Maximum identity"></label>
    <details data-appearance-section="scale-bars">
      <summary>Advanced</summary>
      <label><span>Height</span><input type="number" step="any" data-config="scaleBar.height" aria-label="Height"></label>
      <label><span>Font size</span><input type="number" step="any" data-config="scaleBar.fontSize" aria-label="Font size"></label>
      <label><span>Stroke</span><input type="number" step="any" data-config="scaleBar.stroke" aria-label="Stroke"></label>
      <label><span>Colour</span><input type="color" data-config="scaleBar.colour" aria-label="Colour"></label>
      <label><span>Scale margin</span><input type="number" step="any" data-config="scaleBar.marginTop" aria-label="Scale margin"></label>
      <label><span>Identity width</span><input type="number" step="any" data-config="colourBar.width" aria-label="Identity width"></label>
      <label><span>Identity height</span><input type="number" step="any" data-config="colourBar.height" aria-label="Identity height"></label>
      <label><span>Identity font size</span><input type="number" step="any" data-config="colourBar.fontSize" aria-label="Identity font size"></label>
      <label><span>Identity margin</span><input type="number" step="any" data-config="colourBar.marginTop" aria-label="Identity margin"></label>
    </details>
  </fieldset>
  <fieldset data-appearance-section="plot-navigation">
    <legend>Plot &amp; navigation</legend>
    <label><span>Renderer</span><select data-config="plot.renderer" aria-label="Renderer"><option value="svg">svg</option><option value="canvas">canvas</option><option value="webgpu">webgpu</option></select></label>
    <label><span>Show minimap</span><input type="checkbox" data-config="plot.minimap.show" aria-label="Show minimap"></label>
    <label><span>Minimum zoom</span><input type="number" step="any" data-config="plot.minZoom" aria-label="Minimum zoom"></label>
    <label><span>Maximum zoom</span><input type="number" step="any" data-config="plot.maxZoom" aria-label="Maximum zoom"></label>
    <details data-appearance-section="plot-navigation">
      <summary>Advanced</summary>
      <label><span>Transition (ms)</span><input type="number" step="any" data-config="plot.transitionDuration" aria-label="Transition (ms)"></label>
      <label><span>Scale factor</span><input type="number" step="any" data-config="plot.scaleFactor" aria-label="Scale factor"></label>
      <label><span>Scale genes</span><input type="checkbox" data-config="plot.scaleGenes" aria-label="Scale genes"></label>
      <label><span>Font family</span><input type="text" data-config="plot.fontFamily" aria-label="Font family"></label>
      <label><span>Minimap links</span><input type="checkbox" data-config="plot.minimap.showLinks" aria-label="Minimap links"></label>
      <label><span>Minimap width</span><input type="number" step="any" data-config="plot.minimap.width" aria-label="Minimap width"></label>
      <label><span>Minimap height</span><input type="number" step="any" data-config="plot.minimap.height" aria-label="Minimap height"></label>
      <label><span>Minimap margin</span><input type="number" step="any" data-config="plot.minimap.margin" aria-label="Minimap margin"></label>
    </details>
  </fieldset>
  <p class="empty" hidden></p>
  <clinker-tree-appearance hidden></clinker-tree-appearance>
  <p class="error" role="alert" hidden></p>
</div>
